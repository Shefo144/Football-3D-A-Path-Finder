<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football 3D A* Path Finder</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <div id="game"></div>

    <div id="panel">
        <h1>FOOTBALL <span>3D</span></h1>
        <p class="subtitle">A* PATH FINDING SYSTEM</p>

        <div class="buttons">
            <button id="add">Add Defender</button>
            <button id="remove">Remove Defender</button>
            <button id="random">Randomize</button>
            <button id="find">Find Path</button>
            <button id="play">Play</button>
            <button id="reset">Reset</button>
        </div>

        <div class="stats">
            <div>Path Cost: <b id="cost">0</b></div>
            <div>Path Steps: <b id="steps">0</b></div>
            <div>Nodes Explored: <b id="nodes">0</b></div>
            <div>Search Time: <b id="time">0 ms</b></div>
        </div>

        <div id="status">Ready. Find a path to start.</div>

        <div class="legend">
            <span class="blue"></span> Attacker
            <span class="red"></span> Defenders
            <span class="yellow"></span> Goal
        </div>
    </div>

    <div id="help">
        Drag defenders | Mouse to rotate | Scroll to zoom
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
